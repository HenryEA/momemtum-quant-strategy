[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-stock-momentum-pro"
version = "0.5.0"
description = "Research-grade stock momentum backtester with ensemble/residual momentum, adaptive total-return/core-satellite allocation, volatility targeting, crash controls, costs, benchmarks, and walk-forward validation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Quant Research Project"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "yfinance>=0.2.40",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]
